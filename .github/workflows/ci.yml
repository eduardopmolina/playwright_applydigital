# ---------- GitHub Actions Workflow ----------
name: Playwright Tests and Lighthouse Audits

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - run: pwd
        working-directory: playwright-latam-qa
      - run: npm ci
        working-directory: playwright-latam-qa
      - run: npx playwright install --with-deps
        working-directory: playwright-latam-qa
      - run: npm test
        working-directory: playwright-latam-qa
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-latam-qa/reports/playwright-report

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: pwd
        working-directory: playwright-latam-qa
      - run: npm ci
        working-directory: playwright-latam-qa
      - run: node ./scripts/run-lighthouse.js accessibility
        working-directory: playwright-latam-qa
      - run: node ./scripts/run-lighthouse.js performance
        working-directory: playwright-latam-qa
      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: playwright-latam-qa/reports/*.json
