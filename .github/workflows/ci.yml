# ---------- GitHub Actions Workflow ----------
name: Playwright Tests and Lighthouse Audits

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: playwright-latam-qa/package-lock.json
  
      - run: npm ci
        working-directory: playwright-latam-qa
  
      - run: npx playwright install chromium  # or only the browsers you need
        working-directory: playwright-latam-qa
  
      - run: npx playwright test --workers=4  # or adjust worker count for your repo
        working-directory: playwright-latam-qa
  
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-latam-qa/reports/playwright-report

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Lighthouse
        run: npm install -g lighthouse chrome-launcher

      - name: Install dependencies
        run: npm ci
        working-directory: playwright-latam-qa

      - name: Run Lighthouse Performance Audit
        run: lighthouse https://automationexercise.com --only-categories=performance --output=json --output-path=lh-performance.json --chrome-flags="--headless"
        working-directory: playwright-latam-qa

      - name: Run Lighthouse Accessibility Audit
        run: lighthouse https://automationexercise.com --only-categories=accessibility --output=json --output-path=lh-accessibility.json --chrome-flags="--headless"
        working-directory: playwright-latam-qa

      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            playwright-latam-qa/lh-performance.json
            playwright-latam-qa/lh-accessibility.json
