# ---------- GitHub Actions Workflow ----------
name: Playwright Tests and Lighthouse Audits

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Set up Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # Cache Node.js dependencies
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Install dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: playwright-latam-qa

      # Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: playwright-latam-qa

      # Run tests
      - name: Run Playwright tests
        run: npm test
        working-directory: playwright-latam-qa

      # Upload Playwright Report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-latam-qa/reports/playwright-report

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Lighthouse
        run: npm install -g lighthouse chrome-launcher

      - name: Install dependencies
        run: npm ci
        working-directory: playwright-latam-qa

      - name: Run Lighthouse Performance Audit
        run: lighthouse https://automationexercise.com --only-categories=performance --output=json --output-path=lh-performance.json --chrome-flags="--headless"
        working-directory: playwright-latam-qa

      - name: Run Lighthouse Accessibility Audit
        run: lighthouse https://automationexercise.com --only-categories=accessibility --output=json --output-path=lh-accessibility.json --chrome-flags="--headless"
        working-directory: playwright-latam-qa

      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            playwright-latam-qa/lh-performance.json
            playwright-latam-qa/lh-accessibility.json
